<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simile Collector</title>
<style>
  :root{
    --bg: #F5F3EF;
    --panel: #FFFFFF;
    --ink: #3A3D42;
    --muted: #8B9199;
    --muted-soft: #D8DCE0;
    --gold: #7C9885;
    --gold-soft: #E3E8E1;
    --panel-line: #E4E1DB;
    --danger: #C0392B;
    --ok: #7B98A8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Iowan Old Style','Palatino Linotype',Georgia,serif;
    min-height:100vh;
  }
  html{
    background: #F5F3EF;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 80px;
    background: #F5F3EF;
    min-height: 100vh;
  }
  header{
    text-align:center;
    margin-bottom: 22px;
  }
  header h1{
    font-size: 2rem;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    font-style: italic;
    font-weight: 600;
    color: var(--ink);
  }
  header p{
    margin:0;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
  }

  .tabs{
    display:flex;
    gap: 8px;
    margin-bottom: 22px;
    justify-content:center;
  }
  .tab{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
    padding: 9px 18px;
    border-radius: 20px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--ink);
    cursor:pointer;
    box-shadow: 0 1px 2px rgba(58,42,28,0.08);
  }
  .tab.active{
    border-color: var(--gold);
    color: #FFFAF3;
    background: var(--gold);
  }
  .badge{
    display:inline-block;
    background: var(--ink);
    color: #FFF8EC;
    font-size: 0.7rem;
    font-weight:700;
    border-radius: 10px;
    padding: 1px 7px;
    margin-left: 6px;
  }
  .tab.active .badge{
    background: #FFFAF3;
    color: var(--gold);
  }

  .view{ display:none; }
  .view.active{ display:block; }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 24px;
    box-shadow: 0 1px 3px rgba(58,42,28,0.08);
  }
  label{
    display:block;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field{ margin-bottom: 16px; }
  textarea, input, select{
    width:100%;
    background: #F5F3EF;
    border: 1px solid var(--panel-line);
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 1rem;
  }
  textarea:focus, input:focus, select:focus{
    outline: none;
    border-color: var(--gold);
  }
  textarea{ resize: vertical; min-height: 64px; font-style: italic; }

  .row2{
    display:flex;
    gap: 12px;
  }
  .row2 > div{ flex:1; }

  .cat-add{
    display:flex;
    gap:8px;
    margin-top: 6px;
  }
  .cat-add input{ flex:1; }
  .btn-small{
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 6px;
    padding: 0 14px;
    cursor:pointer;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .btn-small:hover{ background: var(--gold); color: #FFF8EC; }

  .btn-main{
    width:100%;
    background: var(--gold);
    color: #FFF8EC;
    border:none;
    padding: 12px;
    border-radius: 8px;
    font-family: Helvetica, Arial, sans-serif;
    font-weight:700;
    letter-spacing: 0.5px;
    cursor:pointer;
    font-size: 0.95rem;
    box-shadow: 0 2px 5px rgba(189,94,46,0.3);
  }
  .btn-main:hover{ opacity: 0.9; }
  .btn-main:disabled{ opacity:0.4; cursor:not-allowed; }

  .backup-bar{
    display:flex;
    gap: 8px;
    justify-content:flex-end;
    margin-bottom: 12px;
  }
  .search-box{
    display:block;
    width:100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 10px 14px;
    margin-bottom: 12px;
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
  }
  .filters{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .chip{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--panel-line);
    color: var(--ink);
    cursor:pointer;
    background: var(--panel);
    box-shadow: 0 1px 2px rgba(58,42,28,0.06);
  }
  .chip.active{
    border-color: var(--gold);
    color: #FFFAF3;
    background: var(--gold);
  }

  .entry{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
    position: relative;
    box-shadow: 0 1px 3px rgba(58,42,28,0.08);
  }
  .entry.pending{ border-left-color: var(--muted-soft); }
  .entry .quote{
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.5;
    margin: 0 0 10px;
    padding-right: 26px;
    color: var(--ink);
  }
  .spelling-note{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    font-style: italic;
    color: var(--muted-soft);
    margin: -4px 0 10px;
  }
  .entry .meta{
    display:flex;
    justify-content: space-between;
    align-items: center;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }
  .entry .meta .tag{
    color: var(--ok);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  .entry-actions{
    position:absolute;
    top: 10px;
    right: 12px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .entry-actions .edit{
    background:none;
    border:none;
    color: var(--muted-soft);
    cursor:pointer;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.75rem;
    font-weight:700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .entry-actions .edit:hover{ color: var(--gold); }
  .entry-actions .delete{
    background:none;
    border:none;
    color: var(--danger);
    opacity: 0.55;
    cursor:pointer;
    font-size: 1.1rem;
    line-height:1;
  }
  .entry-actions .delete:hover{ color: var(--danger); opacity: 1; }

  .edit-form{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .edit-form label{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.72rem;
    font-weight:700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-top: 6px;
  }
  .edit-form textarea,
  .edit-form input,
  .edit-form select{
    font-family: inherit;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
  }
  .edit-form-actions{
    display:flex;
    gap: 8px;
    margin-top: 12px;
  }

  .review-actions{
    display:flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn-approve, .btn-reject{
    flex:1;
    border:none;
    border-radius: 6px;
    padding: 8px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    font-weight:700;
    cursor:pointer;
  }
  .btn-approve{ background: var(--ok); color: #F5FAF6; }
  .btn-reject{ background: #FBE4DC; border: 1px solid var(--danger); color: var(--danger); }

  .empty{
    text-align:center;
    color: var(--muted);
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.9rem;
    padding: 30px 10px;
  }

  .status{
    text-align:center;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.8rem;
    color: var(--gold);
    height: 18px;
    margin-top: 8px;
  }

  .lock-card{
    text-align:center;
  }
  .lock-card p{
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0;
  }
  .lock-row{
    display:flex;
    gap:8px;
  }
  .signout{
    display:block;
    margin: 18px auto 0;
    background:none;
    border:none;
    color: var(--muted);
    font-family: Helvetica, Arial, sans-serif;
    font-size: 0.78rem;
    cursor:pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>"like a leaf on still water..."</h1>
    <p>Simile Collector</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="library">Library</button>
    <button class="tab" data-tab="add">Add a Simile</button>
    <button class="tab" data-tab="review">Review <span class="badge" id="pendingBadge" style="display:none;">0</span></button>
  </div>

  <!-- LIBRARY VIEW -->
  <div class="view active" id="view-library">
    <input type="text" id="searchInput" class="search-box" placeholder="Search by author, book, or category...">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>

  <!-- ADD VIEW -->
  <div class="view" id="view-add">
    <div class="card">
      <div class="field">
        <label for="simileText">The simile</label>
        <textarea id="simileText" placeholder="e.g. Her voice was like honey poured slowly over gravel."></textarea>
      </div>

      <div class="field">
        <label for="authorInput">Author</label>
        <input id="authorInput" type="text" placeholder="e.g. Toni Morrison">
      </div>

      <div class="row2">
        <div class="field">
          <label for="bookInput">Book</label>
          <input id="bookInput" type="text" placeholder="e.g. Beloved">
        </div>
        <div class="field">
          <label for="chapterInput">Chapter</label>
          <input id="chapterInput" type="text" placeholder="e.g. Chapter 3">
        </div>
      </div>

      <div class="field">
        <label for="submitterInput">Your name (optional)</label>
        <input id="submitterInput" type="text" placeholder="So the reviewer knows who sent it">
      </div>

      <div class="field">
        <label for="categorySelect">Category</label>
        <select id="categorySelect"></select>
        <div class="cat-add">
          <input id="newCategory" type="text" placeholder="Add a new category">
          <button class="btn-small" id="addCategoryBtn">Add</button>
        </div>
      </div>

      <button class="btn-main" id="saveBtn">Submit Simile</button>
      <div class="status" id="status"></div>
      <p style="font-family:Helvetica,Arial,sans-serif;font-size:0.75rem;color:#8a8880;text-align:center;margin-top:10px;">
        Submissions are reviewed before they appear in the Library.
      </p>
    </div>
  </div>

  <!-- REVIEW VIEW -->
  <div class="view" id="view-review">
    <div class="card lock-card" id="lockCard">
      <label for="pinInput" style="text-align:center;">Enter the review PIN</label>
      <div class="lock-row">
        <input id="pinInput" type="password" placeholder="PIN">
        <button class="btn-small" id="unlockBtn">Unlock</button>
      </div>
      <p>Only the reviewer needs this. Default PIN is <strong>2468</strong> — tell Claude if you'd like it changed.</p>
    </div>
    <div id="reviewList" style="display:none;"></div>
    <div class="backup-bar" id="backupBar" style="display:none;">
      <button class="btn-small" id="exportBtn">Download a backup</button>
      <button class="btn-small" id="importBtn">Load a backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
    </div>
    <button class="signout" id="lockAgainBtn" style="display:none;">Lock review screen</button>
  </div>

</div>

let categories = [...DEFAULT_CATEGORIES];
let entries = []; // {id, text, author, chapter, category, submitter, status: 'pending'|'approved'}
let activeFilter = "All";
let unlocked = false;

const $ = (id) => document.getElementById(id);

function showStatus(msg){
  const el = $("status");
  el.textContent = msg;
  setTimeout(()=>{ if(el.textContent === msg) el.textContent=""; }, 2000);
}

// SHARED_BLOB_ID: once set, every visitor (any device, anywhere) reads and writes
// the same shared data. Left blank until the one-time setup step creates it.
const SHARED_BLOB_ID = "019fb00c-891a-781b-ae16-14ce38b9ce61";
const BLOB_API = "https://jsonblob.com/api/jsonBlob";
let blobId = SHARED_BLOB_ID;

async function ensureBlob(){
  if(blobId) return blobId;
  // First time ever running: create the shared storage spot and show the ID
  const initial = {
    "simile-categories": JSON.stringify(DEFAULT_CATEGORIES),
    "simile-entries": JSON.stringify([])
  };
  const res = await fetch(BLOB_API, {
    method: "POST",
    headers: {"Content-Type": "application/json", "Accept": "application/json"},
    body: JSON.stringify(initial)
  });
  const location = res.headers.get("Location") || "";
  blobId = location.split("/").pop();
  showSetupBanner(blobId);
  return blobId;
}

function showSetupBanner(id){
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#2B4640;color:#fff;padding:16px;text-align:center;z-index:9999;font-family:Helvetica,Arial,sans-serif;";
  banner.innerHTML = `<strong>One-time setup needed!</strong> Send this code to Claude: <code style="background:#fff;color:#2B4640;padding:2px 8px;border-radius:4px;">${id}</code>`;
  document.body.prepend(banner);
}

async function storageGet(key){
  const id = await ensureBlob();
  try{
    const res = await fetch(`${BLOB_API}/${id}`, {headers:{"Accept":"application/json"}});
    if(!res.ok) return null;
    const data = await res.json();
    return data[key] || null;
  }catch(e){ return null; }
}

async function storageSet(key, value){
  const id = await ensureBlob();
  try{
    const getRes = await fetch(`${BLOB_API}/${id}`, {headers:{"Accept":"application/json"}});
    const current = getRes.ok ? await getRes.json() : {};
    current[key] = value;
    await fetch(`${BLOB_API}/${id}`, {
      method: "PUT",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify(current)
    });
  }catch(e){ showStatus("Couldn't save — check your connection"); }
}

async function loadData(){
  try{
    const saved = await storageGet("simile-categories");
    if(saved){
      const parsed = JSON.parse(saved);
      categories = Array.from(new Set([...DEFAULT_CATEGORIES, ...parsed]));
    }
  }catch(e){ /* none saved yet */ }

  try{
    const saved = await storageGet("simile-entries");
    if(saved){
      entries = JSON.parse(saved);
    }
  }catch(e){ entries = []; }

  let changedSeed = false;
  SEED_ENTRIES.forEach(seed => {
    const idx = entries.findIndex(e => e.id === seed.id);
    if(idx === -1){
      const dupeByText = entries.some(e => e.text === seed.text && e.id.indexOf("seed-") !== 0);
      if(!dupeByText){
        entries.push(seed);
        changedSeed = true;
      }
    } else if(JSON.stringify(entries[idx]) !== JSON.stringify(seed)){
      entries[idx] = seed;
      changedSeed = true;
    }
  });
  if(changedSeed){
    await saveEntries();
  }

  renderCategorySelect();
  renderFilters();
  renderLibrary();
  updateBadge();
  if(unlocked) renderReview();
}

async function saveCategories(){
  try{
    await storageSet("simile-categories", JSON.stringify(categories));
  }catch(e){ showStatus("Couldn't save category"); }
}

async function saveEntries(){
  try{
    await storageSet("simile-entries", JSON.stringify(entries));
  }catch(e){ showStatus("Couldn't save — try again"); }
}

function renderCategorySelect(){
  const sel = $("categorySelect");
  sel.innerHTML = "";
  categories.forEach(c=>{
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function renderFilters(){
  const wrap = $("filters");
  wrap.innerHTML = "";
  wrap.appendChild(makeChip("All"));
  categories.forEach(c=> wrap.appendChild(makeChip(c)));
}

function makeChip(name){
  const b = document.createElement("button");
  b.className = "chip" + (activeFilter === name ? " active" : "");
  b.textContent = name;
  b.onclick = ()=>{ activeFilter = name; renderFilters(); renderLibrary(); };
  return b;
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

function renderLibrary(){
  const list = $("list");
  list.innerHTML = "";
  const approved = entries.filter(e => e.status === "approved");
  const searchTerm = ($("searchInput").value || "").toLowerCase().trim();
  const shown = approved.filter(e => {
    const matchesFilter = activeFilter === "All" || e.category === activeFilter;
    if(!matchesFilter) return false;
    if(!searchTerm) return true;
    return (e.author || "").toLowerCase().includes(searchTerm)
      || (e.book || "").toLowerCase().includes(searchTerm)
      || (e.category || "").toLowerCase().includes(searchTerm);
  });

  if(shown.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = searchTerm
      ? "No similes match that search."
      : (approved.length === 0
        ? "No approved similes yet. Add one, or wait for submissions to be reviewed."
        : "Nothing approved in this category yet.");
    list.appendChild(empty);
    return;
  }

  shown.slice().reverse().forEach(entry=>{
    const div = document.createElement("div");
    div.className = "entry";
    const sourceBits = [];
    if(entry.author) sourceBits.push(entry.author);
    if(entry.book) sourceBits.push(entry.book);
    if(entry.chapter) sourceBits.push(entry.chapter);
    const sourceText = sourceBits.length ? sourceBits.join(" · ") : "Unknown source";
    const spellingNote = entry.author === "William Shakespeare"
      ? `<p class="spelling-note">Spelling as in the original text</p>`
      : "";

    div.innerHTML = `
      <div class="entry-actions">
        <button class="edit" title="Edit this simile">Edit</button>
        <button class="delete" title="Delete this simile">&times;</button>
      </div>
      <p class="quote">${escapeHtml(entry.text)}</p>
      ${spellingNote}
      <div class="meta">
        <span class="source">${escapeHtml(sourceText)}</span>
        <span class="tag">${escapeHtml(entry.category)}</span>
      </div>
    `;
    div.querySelector(".delete").onclick = ()=> deleteEntry(entry.id);
    div.querySelector(".edit").onclick = ()=> renderEditForm(div, entry);
    list.appendChild(div);
  });
}

function renderEditForm(div, entry){
  div.innerHTML = `
    <div class="edit-form">
      <label>Simile text</label>
      <textarea class="edit-text" rows="3">${escapeHtml(entry.text)}</textarea>
      <label>Author</label>
      <input class="edit-author" value="${escapeHtml(entry.author || "")}">
      <label>Book</label>
      <input class="edit-book" value="${escapeHtml(entry.book || "")}">
      <label>Chapter</label>
      <input class="edit-chapter" value="${escapeHtml(entry.chapter || "")}">
      <label>Category</label>
      <select class="edit-category">
        ${categories.map(c => `<option value="${escapeHtml(c)}" ${c === entry.category ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
      </select>
      <div class="edit-form-actions">
        <button class="btn-small edit-save">Save changes</button>
        <button class="btn-small edit-cancel">Cancel</button>
      </div>
    </div>
  `;
  div.querySelector(".edit-save").onclick = async ()=>{
    const text = div.querySelector(".edit-text").value.trim();
    const author = div.querySelector(".edit-author").value.trim();
    const book = div.querySelector(".edit-book").value.trim();
    const chapter = div.querySelector(".edit-chapter").value.trim();
    const category = div.querySelector(".edit-category").value;
    if(!text || !author || !book || !chapter){
      showStatus("All fields except submitter are required");
      return;
    }
    entries = entries.map(e => e.id === entry.id ? {...e, text, author, book, chapter, category} : e);
    await saveEntries();
    renderLibrary();
    showStatus("Simile updated");
  };
  div.querySelector(".edit-cancel").onclick = ()=> renderLibrary();
}

function updateBadge(){
  const pendingCount = entries.filter(e=>e.status === "pending").length;
  const badge = $("pendingBadge");
  if(pendingCount > 0){
    badge.style.display = "inline-block";
    badge.textContent = pendingCount;
  } else {
    badge.style.display = "none";
  }
}

function renderReview(){
  const wrap = $("reviewList");
  wrap.innerHTML = "";
  const pending = entries.filter(e => e.status === "pending");

  if(pending.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No submissions waiting for review.";
    wrap.appendChild(empty);
    return;
  }

  pending.slice().reverse().forEach(entry=>{
    const div = document.createElement("div");
    div.className = "entry pending";
    const sourceBits = [];
    if(entry.author) sourceBits.push(entry.author);
    if(entry.book) sourceBits.push(entry.book);
    if(entry.chapter) sourceBits.push(entry.chapter);
    const sourceText = sourceBits.length ? sourceBits.join(" · ") : "Unknown source";
    const submittedBy = entry.submitter ? `Submitted by ${entry.submitter}` : "Submitted anonymously";

    div.innerHTML = `
      <p class="quote">${escapeHtml(entry.text)}</p>
      <div class="meta">
        <span class="source">${escapeHtml(sourceText)}</span>
        <span class="tag">${escapeHtml(entry.category)}</span>
      </div>
      <div class="meta"><span>${escapeHtml(submittedBy)}</span></div>
      <div class="review-actions">
        <button class="btn-approve">Approve</button>
        <button class="btn-reject">Reject</button>
      </div>
    `;
    div.querySelector(".btn-approve").onclick = ()=> reviewEntry(entry.id, "approved");
    div.querySelector(".btn-reject").onclick = ()=> reviewEntry(entry.id, "rejected");
    wrap.appendChild(div);
  });
}

async function reviewEntry(id, decision){
  if(decision === "rejected"){
    entries = entries.filter(e => e.id !== id);
  } else {
    entries = entries.map(e => e.id === id ? {...e, status:"approved"} : e);
  }
  await saveEntries();
  renderReview();
  renderLibrary();
  updateBadge();
}

async function deleteEntry(id){
  entries = entries.filter(e=>e.id !== id);
  await saveEntries();
  renderLibrary();
  showStatus("Deleted");
}

function normalizeForCompare(str){
  return str
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function textSimilarity(a, b){
  // Simple word-overlap similarity, good enough for catching near-duplicate submissions
  const wordsA = new Set(a.split(" ").filter(Boolean));
  const wordsB = new Set(b.split(" ").filter(Boolean));
  if(wordsA.size === 0 || wordsB.size === 0) return 0;
  let shared = 0;
  wordsA.forEach(w => { if(wordsB.has(w)) shared++; });
  const union = new Set([...wordsA, ...wordsB]).size;
  return shared / union;
}

function findDuplicate(newText){
  const normalizedNew = normalizeForCompare(newText);
  for(const e of entries){
    if(e.status === "rejected") continue;
    const normalizedExisting = normalizeForCompare(e.text);
    if(normalizedExisting === normalizedNew){
      return e;
    }
    if(textSimilarity(normalizedNew, normalizedExisting) >= 0.82){
      return e;
    }
  }
  return null;
}

$("saveBtn").onclick = async ()=>{
  const text = $("simileText").value.trim();
  const author = $("authorInput").value.trim();
  const book = $("bookInput").value.trim();
  const chapter = $("chapterInput").value.trim();

  if(!text){
    showStatus("Write a simile first");
    return;
  }
  if(!author || !book || !chapter){
    showStatus("Author, book, and chapter are all required");
    return;
  }

  const dupe = findDuplicate(text);
  if(dupe){
    showStatus(`Looks like this is already in the collection (${dupe.book}) — not submitted`);
    return;
  }

  const entry = {
    id: Date.now().toString(),
    text,
    author,
    book,
    chapter,
    submitter: $("submitterInput").value.trim(),
    category: $("categorySelect").value,
    status: "pending"
  };
  entries.push(entry);
  await saveEntries();

  $("simileText").value = "";
  $("authorInput").value = "";
  $("bookInput").value = "";
  $("chapterInput").value = "";
  $("submitterInput").value = "";

  updateBadge();
  showStatus("Submitted for review");
};


$("addCategoryBtn").onclick = async ()=>{
  const val = $("newCategory").value.trim();
  if(!val) return;
  if(categories.some(c => c.toLowerCase() === val.toLowerCase())){
    showStatus("That category already exists");
    return;
  }
  categories.push(val);
  await saveCategories();
  renderCategorySelect();
  $("categorySelect").value = val;
  renderFilters();
  $("newCategory").value = "";
  showStatus("Category added");
};

// Tabs
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    tab.classList.add("active");
    $("view-" + tab.dataset.tab).classList.add("active");
    if(tab.dataset.tab === "library") renderLibrary();
    if(tab.dataset.tab === "review" && unlocked) renderReview();
  };
});

// Review lock
$("unlockBtn").onclick = ()=>{
  if($("pinInput").value === REVIEW_PIN){
    unlocked = true;
    $("lockCard").style.display = "none";
    $("reviewList").style.display = "block";
    $("lockAgainBtn").style.display = "block";
    $("backupBar").style.display = "flex";
    renderReview();
  } else {
    showStatus("");
    $("pinInput").value = "";
    $("pinInput").placeholder = "Wrong PIN, try again";
  }
};
$("lockAgainBtn").onclick = ()=>{
  unlocked = false;
  $("lockCard").style.display = "block";
  $("reviewList").style.display = "none";
  $("lockAgainBtn").style.display = "none";
  $("backupBar").style.display = "none";
  $("pinInput").value = "";
};

$("exportBtn").onclick = ()=>{
  const backup = {
    categories: categories,
    entries: entries,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const today = new Date().toISOString().slice(0,10);
  a.download = `simile-collector-backup-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showStatus("Backup downloaded");
};

$("importBtn").onclick = ()=> $("importFile").click();

$("importFile").onchange = (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (evt)=>{
    try{
      const backup = JSON.parse(evt.target.result);
      if(backup.entries){
        entries = backup.entries;
        await saveEntries();
      }
      if(backup.categories){
        categories = Array.from(new Set([...DEFAULT_CATEGORIES, ...backup.categories]));
        await saveCategories();
      }
      renderCategorySelect();
      renderFilters();
      renderLibrary();
      updateBadge();
      if(unlocked) renderReview();
      showStatus("Backup loaded");
    }catch(err){
      showStatus("That file didn't look like a valid backup");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
};

$("searchInput").oninput = ()=> renderLibrary();

loadData();
</script>
